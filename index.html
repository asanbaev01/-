<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English & Kyrgyz Phrases | Англисче-Кыргызча сүйлөшүүчү сөздүк</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #0b1120;
    --card-bg: rgba(30, 41, 59, 0.65);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #38bdf8;
    --accent-purple: #a78bfa;
    --accent-pink: #f472b6;
    --border: rgba(255, 255, 255, 0.08);
    --glow: 0 0 20px rgba(56, 189, 248, 0.3);
  }

  body.light-mode {
    --bg-color: #f1f5f9;
    --card-bg: rgba(255, 255, 255, 0.85);
    --text-main: #0f172a;
    --text-muted: #475569;
    --border: rgba(0, 0, 0, 0.1);
    background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%);
  }
  body.light-mode .search-box { background: #fff; color: #0f172a; }
  body.light-mode .phrase:hover .phrase-main { background: rgba(0,0,0,0.03); }
  body.light-mode .category h2 { background: rgba(0,0,0,0.05); }
  body.light-mode .quiz-card { background: #fff; }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg-color);
    background-image: 
      radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
      radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
      radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
    background-attachment: fixed;
    min-height: 100vh;
    padding: 40px 20px;
    color: var(--text-main);
    overflow-x: hidden;
    transition: background-color 0.4s, color 0.4s;
  }

  .container { max-width: 1200px; margin: 0 auto; }

  .top-bar {
    display: flex;
    justify-content: flex-end;
    gap: 15px;
    margin-bottom: 20px;
    animation: fadeInDown 1s;
  }
  .icon-btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 10px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .icon-btn:hover { transform: translateY(-3px); box-shadow: var(--glow); border-color: var(--accent); }

  header {
    text-align: center;
    padding: 10px 0 40px;
    animation: fadeInDown 1s cubic-bezier(0.16, 1, 0.3, 1);
  }

  header h1 {
    font-size: 3em;
    font-weight: 800;
    background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc, #f472b6);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 15px;
    letter-spacing: -1px;
    animation: gradientShift 5s ease infinite;
  }

  header p {
    color: var(--text-muted);
    font-size: 1.1em;
    animation: fadeIn 1.5s ease;
  }

  .progress-container {
    width: 100%;
    background: var(--card-bg);
    border-radius: 20px;
    margin-bottom: 30px;
    overflow: hidden;
    border: 1px solid var(--border);
    animation: fadeInUp 1s;
  }
  .progress-bar {
    height: 8px;
    background: linear-gradient(90deg, var(--accent), var(--accent-purple));
    width: 0%;
    transition: width 0.5s ease;
  }
  .progress-text {
    padding: 10px 20px;
    font-size: 0.9em;
    color: var(--text-muted);
    text-align: right;
  }

  .search-container {
    position: relative;
    margin-bottom: 30px;
    animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s backwards;
  }

  .search-box {
    width: 100%;
    padding: 20px 30px;
    font-size: 1.1em;
    font-family: inherit;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-main);
    outline: none;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
  }

  .search-box:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15), var(--glow);
    transform: translateY(-2px);
  }

  .categories-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
    gap: 30px;
    align-items: start;
  }

  .category {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
    animation: scaleIn 0.6s backwards;
  }
  .category:hover { transform: translateY(-5px); box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3); }

  .category h2 {
    background: rgba(255, 255, 255, 0.03);
    padding: 22px 28px;
    font-size: 1.25em;
    font-weight: 700;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }
  .category h2::after {
    content: '';
    position: absolute;
    left: -100%;
    top: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: left 0.5s;
  }
  .category:hover h2::after { left: 100%; }

  .phrase {
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid var(--border);
    position: relative;
    transition: background 0.3s;
  }
  .phrase:last-child { border-bottom: none; }

  .phrase-main {
    padding: 20px 28px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    transition: all 0.3s;
  }

  .phrase-main:hover { background: rgba(255, 255, 255, 0.04); padding-left: 35px; }

  .phrase-content { flex: 1; }

  .en {
    font-size: 1.4em;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .pronunciation {
    font-size: 0.75em;
    color: var(--accent-purple);
    font-weight: 600;
    background: rgba(167, 139, 250, 0.12);
    padding: 4px 12px;
    border-radius: 10px;
    border: 1px solid rgba(167, 139, 250, 0.2);
    transition: transform 0.3s;
  }
  .phrase-main:hover .pronunciation { transform: scale(1.05); }

  .kg { color: var(--text-muted); font-size: 1.05em; margin-top: 4px; }

  .action-btns { display: flex; gap: 8px; }
  .action-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 40px; height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.2em;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .action-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-main); transform: scale(1.1); box-shadow: 0 0 10px rgba(0,0,0,0.3); }
  .action-btn.fav-active { color: #f472b6; background: rgba(244, 114, 182, 0.15); border-color: #f472b6; }
  .action-btn.speaking { animation: pulse 1s infinite; color: var(--accent); }

  .explanation {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease, padding 0.4s ease;
    background: rgba(15, 23, 42, 0.4);
    opacity: 0;
  }

  .phrase.active .explanation {
    max-height: 400px;
    opacity: 1;
    padding: 0 28px 20px 28px;
    border-top: 1px dashed var(--border);
  }

  .explanation-content { padding-top: 15px; font-size: 0.95em; color: #cbd5e1; line-height: 1.6; }
  .explanation-content .note {
    display: block; margin-top: 10px; font-size: 0.85em; color: var(--text-muted);
    font-style: italic; background: rgba(255,255,255,0.03); padding: 8px 12px;
    border-radius: 8px; border-left: 2px solid var(--accent-purple);
  }

  .quiz-modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(8px);
    animation: fadeIn 0.3s;
  }
  .quiz-modal.active { display: flex; }
  .quiz-card {
    background: var(--bg-color); width: 90%; max-width: 500px;
    border-radius: 24px; padding: 30px; border: 1px solid var(--border);
    box-shadow: 0 20px 50px rgba(0,0,0,0.6); text-align: center;
    animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .quiz-question { font-size: 1.5em; font-weight: 700; margin: 20px 0; color: var(--text-main); animation: fadeInUp 0.4s; }
  .quiz-options { display: flex; flex-direction: column; gap: 12px; }
  .quiz-opt {
    background: var(--card-bg); border: 1px solid var(--border); padding: 15px;
    border-radius: 12px; cursor: pointer; font-family: inherit; font-size: 1em;
    color: var(--text-main); transition: all 0.3s;
  }
  .quiz-opt:hover { background: rgba(255,255,255,0.1); transform: translateX(5px); }
  .quiz-opt.correct { background: #16a34a; color: white; border-color: #16a34a; transform: scale(1.02); }
  .quiz-opt.wrong { background: #dc2626; color: white; border-color: #dc2626; animation: shake 0.3s; }
  .quiz-result { margin-top: 20px; font-size: 1.2em; font-weight: 600; animation: fadeIn 0.3s; }

  .fav-modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(8px);
    animation: fadeIn 0.3s;
  }
  .fav-modal.active { display: flex; }
  .fav-card {
    background: var(--bg-color); width: 90%; max-width: 600px; max-height: 80vh;
    border-radius: 24px; padding: 30px; border: 1px solid var(--border);
    box-shadow: 0 20px 50px rgba(0,0,0,0.6); display: flex; flex-direction: column;
    animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .fav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .fav-header h2 { color: #f472b6; margin: 0; }
  .fav-list { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 10px; }
  .fav-list::-webkit-scrollbar { width: 6px; }
  .fav-list::-webkit-scrollbar-track { background: transparent; }
  .fav-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .fav-item { background: var(--card-bg); border: 1px solid var(--border); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; animation: fadeInUp 0.3s; }
  .fav-item .en { font-size: 1.1em; margin: 0; }
  .fav-item .kg { font-size: 0.9em; }
  .fav-empty { text-align: center; color: var(--text-muted); padding: 40px 0; font-style: italic; }

  footer { text-align: center; color: var(--text-muted); padding: 60px 0 20px; font-size: 0.9em; }

  @keyframes fadeInDown { from { opacity: 0; transform: translateY(-40px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); box-shadow: 0 0 15px var(--accent); } 100% { transform: scale(1); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  @media (max-width: 1000px) { .categories-grid { grid-template-columns: 1fr; } }
  @media (max-width: 600px) {
    body { padding: 15px 10px; }
    header h1 { font-size: 1.8em; }
    .phrase-main { padding: 15px 18px; flex-direction: column; align-items: flex-start; }
    .phrase-main:hover { padding-left: 18px; }
    .action-btns { width: 100%; justify-content: flex-end; margin-top: 10px; }
    .en { font-size: 1.15em; }
    .phrase.active .explanation { padding: 0 18px 15px 18px; max-height: 600px; }
    .top-bar { flex-wrap: wrap; justify-content: center; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <button class="icon-btn" id="themeToggle">🌙 Тема</button>
    <button class="icon-btn" id="showFavorites" style="background: rgba(244, 114, 182, 0.15); color: #f472b6; border-color: #f472b6;">❤️ Избранное</button>
    <button class="icon-btn" id="startQuiz" style="background: var(--accent); color: white; border: none;">🎮 Квиз ойноо</button>
  </div>

  <header>
    <h1>English & Kyrgyz 🇬🇧</h1>
    <p>Баскычтарды колдонуп үйрөнүңүз: Үн, Сүйүктүүлөр, Квиз</p>
  </header>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
    <div class="progress-text" id="progressText">Үйрөнүлдү: 0 / 0 сөз</div>
  </div>

  <div class="search-container">
    <input type="text" class="search-box" id="search" placeholder="🔍 Найти слово или фразу...">
  </div>

  <div class="categories-grid" id="phrases"></div>

  <footer>💡 Нажмите на фразу, чтобы увидеть перевод, или используйте кнопки 🔊 (звук) и ❤️ (сохранить)</footer>
</div>

<div class="quiz-modal" id="quizModal">
  <div class="quiz-card">
    <h2 style="color: var(--accent);">🎮 Квиз</h2>
    <p style="color: var(--text-muted); margin-top: 10px;">Туура котормону тандаңыз</p>
    <div class="quiz-question" id="quizQuestion">Жүктөлүүдө...</div>
    <div class="quiz-options" id="quizOptions"></div>
    <div class="quiz-result" id="quizResult"></div>
    <button class="icon-btn" onclick="document.getElementById('quizModal').classList.remove('active')" style="margin-top: 20px; width: 100%;">Жабуу</button>
  </div>
</div>

<div class="fav-modal" id="favModal">
  <div class="fav-card">
    <div class="fav-header">
      <h2>❤️ Избранное</h2>
      <button class="icon-btn" onclick="document.getElementById('favModal').classList.remove('active')">✖ Жабуу</button>
    </div>
    <div class="fav-list" id="favList"></div>
  </div>
</div>

<script>
const data = [
  {
    category: "👤 Өзүм жөнүндө айтуу (О себе)",
    items: [
      { en: "My name is Asylbek", pron: "май нэйм из Асылбек", kg: "Менин атым Асылбек", desc: "Өзүңүздү тааныштыруудагы эң негизги фраза.", note: "Кыскартылган түрү: 'I'm Asylbek' (айм Асылбек)." },
      { en: "I am 17 years old", pron: "ай эм сэвэн-тин йиэз оулд", kg: "Мен 17 жаштамын", desc: "Жашыңызды айтуу үчүн колдонулат.", note: "Жашты так айткыңыз келбесе, 'I am a teenager' (ай эм э тин-эй-жэ) — 'Мен өспүрүммүн' десеңиз болот." },
      { en: "I am from Kyrgyzstan", pron: "ай эм фром кыргызстан", kg: "Мен Кыргызстанданмын", desc: "Кайдан болгонуңузду айтуу.", note: "Эгер шаарды айткыңыз келсе: 'I am from Bishkek' (ай эм фром Бишкек)." },
      { en: "I am a student", pron: "ай эм э стью-дэнт", kg: "Мен студентмин", desc: "Кесибиңизди же эмне кылып жатканыңызды айтуу.", note: "Мектепте окусаңыз: 'I am a school student' (ай эм э скуул стью-дэнт)." },
      { en: "I like to learn English", pron: "ай лайк ту лён инг-лиш", kg: "Мен англис тилин үйрөнгөндү жакшы көрөм", desc: "Англис тилин үйрөнүп жатканыңызды жана ага болгон кызыгууңузду билдирүү.", note: "Жөнөкөйүрөөк: 'I study English' (ай ста-ди инг-лиш)." },
      { en: "My hobby is playing football", pron: "май хоб-би из плэй-инг фут-бол", kg: "Менин хоббим футбол ойноо", desc: "Эмне менен алектенерингизди айтуу.", note: "Ойноо: 'playing' (плэй-инг), окуу: 'reading' (ри-динг), сүрөт тартуу: 'drawing' (дроу-инг)." },
      { en: "Nice to meet you!", pron: "найс ту мит ю", kg: "Таанышканыма кубанычтамын!", desc: "Жаңы адам менен таанышканда айтылат.", note: "Расмий түрү: 'Pleased to meet you' (плизд ту мит ю)." },
      { en: "What is your name?", pron: "уот из ё нэйм", kg: "Сиздин атыңыз ким?", desc: "Каршы тараптын атын суроо.", note: "Бейрасмий: 'What's your name?' (уотс ё нэйм)." }
    ]
  },
  {
    category: "👋 Приветствия и прощания (Саламдашуу)",
    items: [
      { en: "Hello", pron: "хэ-лоу", kg: "Салам / Саламдашуу", desc: "Эң көп колдонулган жана универсалдуу саламдашуу.", note: "Кыскартылган түрү: 'Hi' (хай) — жакын досторго." },
      { en: "Hi", pron: "хай", kg: "Салам (бейрасмий)", desc: "Расмий эмес, достор менен саламдашууда.", note: "Көбүнчө жаштар арасында." },
      { en: "Hey", pron: "хэй", kg: "Эй / Салам", desc: "Абдан бейрасмий, көбүнчө жакын досторго.", note: "Расмий жерлерде колдонууга болбойт." },
      { en: "What's up?", pron: "уотс ап", kg: "Эмне жаңылык?", desc: "Достор менен бейрасмий саламдашуу.", note: "Жооп: 'Not much' (нот мач)." },
      { en: "Good morning", pron: "гуд мо-нинг", kg: "Куттуу таң", desc: "Эртең мененки саламдашуу.", note: "Расмий жана жарым расмий." },
      { en: "Good afternoon", pron: "гуд аф-тэ-нун", kg: "Кайырлуу күн", desc: "Түштөн кийинки саламдашуу.", note: "Көбүнчө расмий." },
      { en: "Good evening", pron: "гуд ив-нинг", kg: "Кайырлуу кеч", desc: "Кечки саламдашуу.", note: "Коомдук жайларда." },
      { en: "Goodbye", pron: "гуд-бай", kg: "Кош болуңуз", desc: "Жалпы коштошуу сөзү.", note: "Кыскартылган түрү: 'Bye' (бай)." },
      { en: "See you later", pron: "си ю лэй-тэ", kg: "Көрүшкөнчө", desc: "Жакында кайра көрүшө тургандарга.", note: "Досторго ылайыктуу." },
      { en: "Take care", pron: "тэйк кээ", kg: "Аман бол", desc: "Коштошууда камкордук билдирүү.", note: "Жакын адамдарга." },
      { en: "Good night", pron: "гуд найт", kg: "Жакшы түн", desc: "Уктоого жатар алдында.", note: "Үй-бүлө менен." },
      { en: "Long time no see", pron: "лонг тайм ноу си", kg: "Көрүшпөй калдык", desc: "Узак убакыттан кийин жолукканда.", note: "Жылуу сөз." }
    ]
  },
  {
    category: "🙏 Вежливость и благодарность (Ыраазычылык)",

let totalWords = 0;
data.forEach(cat => totalWords += cat.items.length);

let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
let learnedWords = JSON.parse(localStorage.getItem('learned')) || [];

const container = document.getElementById('phrases');
const favList = document.getElementById('favList');

function render(filter = '') {
  container.innerHTML = '';
  let delay = 0;

  data.forEach(cat => {
    const filtered = cat.items.filter(i =>
      i.en.toLowerCase().includes(filter.toLowerCase()) ||
      i.pron.toLowerCase().includes(filter.toLowerCase()) ||
      i.kg.toLowerCase().includes(filter.toLowerCase()) ||
      i.desc.toLowerCase().includes(filter.toLowerCase())
    );
    if (filtered.length === 0) return;

    const div = document.createElement('div');
    div.className = 'category';
    div.style.animationDelay = `${delay}s`;
    delay += 0.05;
    
    div.innerHTML = `<h2>${cat.category}</h2>`;
    
    filtered.forEach(item => {
      const p = document.createElement('div');
      p.className = 'phrase';
      const isFav = favorites.includes(item.en);
      
      p.innerHTML = `
        <div class="phrase-main">
          <div class="phrase-content">
            <div class="en">
              ${item.en} 
              <span class="pronunciation">[${item.pron}]</span>
            </div>
            <div class="kg">${item.kg}</div>
          </div>
          <div class="action-btns">
            <button class="action-btn speak-btn" title="Угуу">🔊</button>
            <button class="action-btn fav-btn ${isFav ? 'fav-active' : ''}" title="Сактоо">${isFav ? '❤️' : '🤍'}</button>
          </div>
        </div>
        <div class="explanation">
          <div class="explanation-content">
            ${item.desc}
            <span class="note">💡 ${item.note}</span>
          </div>
        </div>
      `;
      
      const phraseContent = p.querySelector('.phrase-content');
      
      phraseContent.onclick = () => {
        p.classList.toggle('active');
        if (!learnedWords.includes(item.en)) {
          learnedWords.push(item.en);
          localStorage.setItem('learned', JSON.stringify(learnedWords));
          updateProgress();
        }
      };
      
      p.querySelector('.speak-btn').onclick = (e) => {
        e.stopPropagation();
        const btn = e.target;
        btn.classList.add('speaking');
        
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(item.en);
        utterance.lang = 'en-US';
        utterance.onend = () => btn.classList.remove('speaking');
        window.speechSynthesis.speak(utterance);
      };

      const favBtn = p.querySelector('.fav-btn');
      favBtn.onclick = (e) => {
        e.stopPropagation();
        if (favorites.includes(item.en)) {
          favorites = favorites.filter(f => f !== item.en);
          favBtn.classList.remove('fav-active');
          favBtn.innerHTML = '🤍';
        } else {
          favorites.push(item.en);
          favBtn.classList.add('fav-active');
          favBtn.innerHTML = '❤️';
        }
        localStorage.setItem('favorites', JSON.stringify(favorites));
      };
      
      div.appendChild(p);
    });
    
    container.appendChild(div);
  });
}

function updateProgress() {
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const percentage = (learnedWords.length / totalWords) * 100;
  progressBar.style.width = `${percentage}%`;
  progressText.innerText = `Үйрөнүлдү: ${learnedWords.length} / ${totalWords} сөз`;
}

const quizModal = document.getElementById('quizModal');
const quizQuestion = document.getElementById('quizQuestion');
const quizOptions = document.getElementById('quizOptions');
const quizResult = document.getElementById('quizResult');

document.getElementById('startQuiz').onclick = () => {
  quizModal.classList.add('active');
  startNewQuestion();
};

function startNewQuestion() {
  quizResult.innerText = '';
  quizOptions.innerHTML = '';
  
  const allItems = data.flatMap(cat => cat.items);
  const randomItem = allItems[Math.floor(Math.random() * allItems.length)];
  
  quizQuestion.innerText = randomItem.kg;
  
  let wrongAnswers = [];
  while(wrongAnswers.length < 3) {
    const randomWrong = allItems[Math.floor(Math.random() * allItems.length)];
    if (randomWrong.en !== randomItem.en && !wrongAnswers.includes(randomWrong.en)) {
      wrongAnswers.push(randomWrong.en);
    }
  }
  
  const options = [randomItem.en, ...wrongAnswers].sort(() => Math.random() - 0.5);
  
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quiz-opt';
    btn.innerText = opt;
    btn.onclick = () => {
      if (opt === randomItem.en) {
        btn.classList.add('correct');
        quizResult.innerText = '✅ Туура!';
        quizResult.style.color = '#16a34a';
      } else {
        btn.classList.add('wrong');
        quizResult.innerText = '❌ Туура эмес. Туура жооп: ' + randomItem.en;
        quizResult.style.color = '#dc2626';
      }
      Array.from(quizOptions.children).forEach(b => b.disabled = true);
      setTimeout(startNewQuestion, 2000);
    };
    quizOptions.appendChild(btn);
  });
}

const favModal = document.getElementById('favModal');

document.getElementById('showFavorites').onclick = () => {
  favModal.classList.add('active');
  renderFavList();
};

function renderFavList() {
  favList.innerHTML = '';
  if (favorites.length === 0) {
    favList.innerHTML = '<div class="fav-empty">Сүйүктүүлөр тизмеси бош. Сөздөрдүн жанындагы ❤️ белгисин басып кошуңуз.</div>';
    return;
  }
  const allItems = data.flatMap(cat => cat.items);
  favorites.forEach(favEn => {
    const item = allItems.find(i => i.en === favEn);
    if (item) {
      const div = document.createElement('div');
      div.className = 'fav-item';
      div.innerHTML = `
        <div>
          <div class="en">${item.en}</div>
          <div class="kg">${item.kg}</div>
        </div>
        <button class="action-btn speak-btn" title="Угуу">🔊</button>
      `;
      div.querySelector('.speak-btn').onclick = () => {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(item.en);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      };
      favList.appendChild(div);
    }
  });
}

render();
updateProgress();
</script>
</body>
</html>
